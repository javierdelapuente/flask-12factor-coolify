services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: visitors
      POSTGRES_USER: ${SERVICE_USER_POSTGRES:?}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES:?}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    build: .
    restart: unless-stopped
    environment:
      PORT: "5000"
      POSTGRESQL_DB_CONNECT_STRING: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_64_POSTGRES}@db:5432/visitors
      SERVICE_URL_WEB: /
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/visitors', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
